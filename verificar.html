<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://script.google.com https://*.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Verificar declaração</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="topo"><div class="topo-in"><img id="logo-topo" class="topo-logo" src="logo.png" width="74" height="68" alt=""><span class="topo-nome">ProLEEI-MT</span></div></header>
<main class="miolo">
  <section class="tela estreita">
    <h1>Verificar declaração</h1>
    <p class="lead">Digite o código impresso no documento ou leia o QR Code com a câmera do celular. Você verá os dados registrados oficialmente.</p>
    <form id="form-codigo" class="folha" novalidate>
      <div class="campo">
        <label for="codigo">Código de verificação</label>
        <div class="campo-linha">
          <input id="codigo" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="XXXX-XXXX" aria-describedby="ajuda-codigo">
          <button class="btn primario" id="btn-verificar" type="submit">Verificar</button>
        </div>
        <p class="ajuda" id="ajuda-codigo">São 8 letras e números, no formato <span class="nq">XXXX-XXXX</span>.</p>
      </div>
    </form>
    <section id="resultado" class="resultado" aria-live="polite"></section>
  </section>
  <p class="rodape">Programa Leitura e Escrita na Educação Infantil (ProLEEI-MT).</p>
</main>
<noscript><p class="miolo">Esta página precisa do JavaScript ativado no navegador.</p></noscript>
<script src="config.js"></script>
<script src="comum.js"></script>
<script src="verificar.js"></script>
</body>
</html>
